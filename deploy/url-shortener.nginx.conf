server {
    server_name go.adityag.dev 3.110.221.208 _;

    # Landing page, root URL only.
    #
    # "location = /" is an EXACT match, so it applies to "/" and nothing else.
    # In nginx, an exact match beats the "location /" prefix match below, so a
    # request for "/" is served this static file and never reaches Spring Boot.
    # RootController stays in place as a fallback for anything that bypasses
    # nginx (localhost requests on the box, health checks, API tooling).
    location = / {
        root /var/www/urlshortener;
        try_files /index.html =404;
    }

    # Everything else -> Spring Boot.
    #
    # This prefix match still handles every other path, so all API routes and
    # short-code redirects ("/api/...", "/{shortCode}") are proxied exactly as
    # before. Adding the block above does not change their behaviour.
    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/go.adityag.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/go.adityag.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = go.adityag.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name go.adityag.dev 3.110.221.208 _;
    return 404; # managed by Certbot


}