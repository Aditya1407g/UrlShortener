server {
    server_name go.adityag.dev 3.110.221.208 _;

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/go.adityag.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/go.adityag.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = go.adityag.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name go.adityag.dev 3.110.221.208 _;
    return 404; # managed by Certbot


}